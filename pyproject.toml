[project]
name = "garrison"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jaisidhsingh", email = "jaisidhsingh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "nemo-automodel",
]

[project.scripts]
garrison = "garrison:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "lib/nemotron_base",
]

[tool.uv.sources]
nemo-automodel = { workspace = true, editable = true }
